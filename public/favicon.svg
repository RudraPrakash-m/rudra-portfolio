<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Premium Professional Tech Gradient -->
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Emerald Glow Accent Gradient -->
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background Squircle -->
  <rect width="64" height="64" rx="15" fill="#090a0f" />
  
  <!-- Subtle Luxury Border -->
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="#222734" stroke-width="1.2" />

  <!-- High-Impact, Prominent, Large Professional "R" Monogram (Maximizes Canvas Area) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bold Vertical Pillar -->
    <path 
      d="M16 11 L16 53" 
      stroke="url(#proGrad)" 
      stroke-width="8.5" 
    />
    
    <!-- Bold Upper Loop -->
    <path 
      d="M16 15.25 L34.5 15.25 C43 15.25 48.5 20.5 48.5 28.5 C48.5 36.5 43 41.75 34.5 41.75 L16 41.75" 
      stroke="url(#proGrad)" 
      stroke-width="8.5" 
    />
    
    <!-- Bold High-Energy Dynamic Kick -->
    <path 
      d="M31 39 L49 53" 
      stroke="url(#mintAccent)" 
      stroke-width="8.5" 
    />
  </g>

  <!-- Precision Minimalist Accent Dot -->
  <circle cx="50" cy="14" r="3.2" fill="#10b981" />
</svg>